name: Encrypted database and assets backup
on:
  workflow_dispatch:
  schedule:
    - cron: '23 18 * * *'
permissions:
  contents: read
concurrency:
  group: orbis-disaster-backup
  cancel-in-progress: false
jobs:
  backup:
    # Manual first backup is available; enable cron only after the restore drill.
    if: github.event_name == 'workflow_dispatch' || vars.DB_BACKUP_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: supabase/setup-cli@v1
        with:
          version: 2.119.0
      - name: Install dependencies and age
        run: |
          corepack enable
          corepack prepare pnpm@11.19.0 --activate
          pnpm install --frozen-lockfile
          sudo apt-get update -qq
          sudo apt-get install -y age
      - name: Encrypt, upload and read back
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          BACKUP_AGE_RECIPIENT: ${{ secrets.BACKUP_AGE_RECIPIENT }}
          DB_BACKUP_HEALTHCHECK_URL: ${{ secrets.DB_BACKUP_HEALTHCHECK_URL }}
          BACKUP_POSTGRES_MAJOR: '17'
          R2_MAX_STORAGE_BYTES: '9000000000'
        run: node scripts/disaster-backup.mjs
