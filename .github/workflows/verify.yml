name: Verify app and backup encryption
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          corepack enable
          corepack prepare pnpm@11.19.0 --activate
          pnpm install --frozen-lockfile
          pnpm docs:check --base "$DOCS_BASE_SHA"
          pnpm typecheck
          pnpm test
          pnpm build
        env:
          DOCS_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
      - name: Real age encryption and decryption round trip
        shell: bash
        run: |
          set -eu
          sudo apt-get update -qq
          sudo apt-get install -y age
          check_dir=$(mktemp -d)
          trap 'rm -rf "$check_dir"' EXIT
          age-keygen -o "$check_dir/test-identity" 2>/dev/null
          age-keygen -y "$check_dir/test-identity" > "$check_dir/public"
          printf 'Orbis Tertius encryption verification\n' > "$check_dir/original"
          age -r "$(cat "$check_dir/public")" -o "$check_dir/archive.age" "$check_dir/original"
          age -d -i "$check_dir/test-identity" -o "$check_dir/restored" "$check_dir/archive.age"
          cmp "$check_dir/original" "$check_dir/restored"
      - name: Anti Slop lint (advisory during adoption)
        continue-on-error: true
        run: pnpm --silent exec oxlint . --format json > anti-slop-lint.json
      - name: Verify Anti Slop loaded and reported diagnostics
        run: |
          node --input-type=module <<'JS'
          import { readFileSync } from 'node:fs';

          const report = JSON.parse(readFileSync('anti-slop-lint.json', 'utf8'));

          if (report.number_of_rules !== 19 || report.number_of_files < 1 || !Array.isArray(report.diagnostics)) {
            throw new Error('Anti Slop did not produce a complete lint report.');
          }

          console.log(`Anti Slop: ${report.number_of_files} files, ${report.number_of_rules} rules, ${report.diagnostics.length} findings.`);
          JS
      - name: Upload Anti Slop diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: anti-slop-lint
          path: anti-slop-lint.json
          if-no-files-found: ignore
